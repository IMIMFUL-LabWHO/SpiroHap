[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spirohap"
version = "0.1.0"
description = "Read-level haplotype reconstruction for Spiroplasma ixodetis 23S Nanopore amplicons"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SpiroHap contributors"}]
dependencies = ["edlib>=1.3.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spirohap = "spirohap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

